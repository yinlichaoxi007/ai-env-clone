name: Mirror to Gitee

on:
  push:
    branches: [main, master]
    # 发布 tag 推送时也镜像，确保 Gitee 上 tag 与 GitHub 一致
    # （Gitee Release 创建需要同名 tag 已存在）
    tags: ["v*", "beta*", "rc*", "alpha*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust Gitee host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Mirror to Gitee
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@gitee.com:yinlichaoxi007/ai-env-clone.git
          ssh_private_key: ${{ secrets.GITEE_SSH_KEY }}
