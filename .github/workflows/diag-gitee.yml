name: Diag Gitee Rebuild

# 临时诊断 workflow：复现 gitee_upload.sh 的 GITEE_REBUILD 删除→重建流程，
# 把每步 API 响应写入 diag_log.txt 并上传 artifact，便于定位 Gitee 重建失败根因。
# 用后即删。

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reproduce rebuild
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || '' }}
          TAG: "v0.1.0rc"
          PRERELEASE: "true"
        shell: bash
        run: |
          set -u
          REPO="yinlichaoxi007/ai-env-clone"
          LOG="diag_log.txt"
          : > "$LOG"
          log() { echo "$1" | tee -a "$LOG"; }
          if [ -z "$GITEE_TOKEN" ]; then
            log "NO GITEE_TOKEN configured"
            exit 1
          fi
          log "=== 1. query release tags/$TAG ==="
          RESP=$(curl -sS -G "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG" \
                 --data-urlencode "access_token=$GITEE_TOKEN" || true)
          log "RESP=$RESP"
          RID=$(printf '%s' "$RESP" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          log "RID=$RID"
          if [ -n "$RID" ]; then
            log "=== 2. DELETE release id=$RID ==="
            DRESP=$(curl -sS -X DELETE "https://gitee.com/api/v5/repos/$REPO/releases/$RID?access_token=$GITEE_TOKEN" || true)
            log "DELETE_RESP=$DRESP"
            sleep 5
            RID=""
          fi
          log "=== 3. create release (retry x3) ==="
          for i in 1 2 3; do
            RESP=$(curl -sS -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
                  --data-urlencode "access_token=$GITEE_TOKEN" \
                  --data-urlencode "tag_name=$TAG" \
                  --data-urlencode "name=$TAG" \
                  --data-urlencode "target_commitish=main" \
                  --data-urlencode "prerelease=$PRERELEASE" || true)
            log "attempt $i RESP=$RESP"
            RID=$(printf '%s' "$RESP" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
            if [ -n "$RID" ]; then
              log "CREATED RID=$RID"
              break
            fi
            sleep 3
          done
          log "=== done RID=${RID:-empty} ==="

      - name: Upload diag log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-log
          path: diag_log.txt
          if-no-files-found: warn
