name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "beta*"
      - "rc*"
      - "alpha*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（需已存在于仓库，如 v1.2.3）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AiEnvClone-windows
            base_name: AiEnvClone-windows
            upload_path: dist/AiEnvClone-windows.exe
            zip_app: false
          - os: macos-latest        # Apple Silicon (arm64)
            artifact: AiEnvClone-macos-arm64
            base_name: AiEnvClone-macos-arm64
            upload_path: dist/AiEnvClone-macos-arm64.app
            zip_app: true
          - os: macos-15-intel      # Intel (x86_64)，macos-13 已于 2025-12-04 退役
            artifact: AiEnvClone-macos-x86_64
            base_name: AiEnvClone-macos-x86_64
            upload_path: dist/AiEnvClone-macos-x86_64.app
            zip_app: true
          - os: ubuntu-latest
            artifact: AiEnvClone-linux
            base_name: AiEnvClone-linux
            upload_path: dist/AiEnvClone-linux
            zip_app: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # setup-python 使用 python-build-standalone 构建，自带 tkinter/Tcl-Tk，
      # 所有平台统一用它，避免 runner 自带系统 python3 缺 tkinter。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Ensure tkinter
        run: python -c "import tkinter; print('tkinter ok')"

      - name: Install build deps
        run: pip install -r requirements.txt

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
        run: python build_exe.py --name ${{ matrix.base_name }}

      # macOS 产出的是 dist/ 下的 .app 目录，压缩后上传更便于分发。
      - name: Zip macOS app
        if: ${{ matrix.zip_app }}
        shell: bash
        run: |
          cd dist
          zip -r "../${{ matrix.artifact }}.zip" "${{ matrix.base_name }}.app"

      - name: Upload artifact (zip)
        if: ${{ matrix.zip_app }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (binary)
        if: ${{ !matrix.zip_app }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 生成 release notes 需要完整 git 历史来比较 tag 范围
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 项目直接 push 无 PR 流程，GitHub 自动 notes 的 "What's Changed"
      # 为空只剩 Full Changelog 链接；改为用 git log 列出实际 commit。
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log --oneline --no-decorate "$PREV_TAG".."$TAG" > notes.md
          else
            git log --oneline --no-decorate "$TAG" > notes.md
          fi
          echo "===== notes.md ====="; cat notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Decide prerelease
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 含 rc/beta/alpha/preview/dev 等标识即预发布；
          # 纯 v1.2.3 这类稳定版本才标记正式版。
          case "$TAG" in
            *[Rr][Cc]*|*[Bb][Ee][Tt][Aa]*|*[Aa][Ll][Pp][Hh][Aa]*|*[Pp][Rr][Ee][Vv][Ii][Ee][Ww]*|*[Dd][Ee][Vv]*)
              echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: List assets
        run: ls -la assets

      # 幂等化：重打标签（tag 移动/删除重建）时，GitHub 上可能残留同名旧 release
      # （删除 tag 不会自动删除 release），softprops/action-gh-release 创建会报
      # "Too many retries"。先删除已存在的同 tag release 再创建，保证资产是最新构建。
      - name: Delete existing release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "== deleting existing release $TAG =="
            gh release delete "$TAG" --yes
          else
            echo "no existing release $TAG"
          fi

      # softprops/action-gh-release@v2 是 Node20 action，2025-09 起 GitHub
      # 强制其在 Node24 上运行，实测上传资产报 "Too many retries" 掩盖真实错误。
      # 改用 gh CLI 原生创建 + 上传（runner 预装，日志直出具体错误）。
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -e
          ls -la assets
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" assets/* \
              --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" assets/* \
              --title "$TAG" --notes-file notes.md
          fi

      # 镜像 Release 到 Gitee（需仓库配置 GITEE_TOKEN secret）。
      # 需要 Gitee 上已存在同 tag（mirror-to-gitee.yml 已同步 git 与 tag）。
      # 注意：secrets 不允许用在 if 条件中（workflow 解析会失败），
      # 因此通过 env 传入，脚本内检查空值跳过。
      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || '' }}
          # GITEE_REBUILD=1：每次构建都删除 Gitee 同名 release 后重建（资产全量上传），
          # 避免幂等跳过导致 Gitee 残留上一次构建的旧资产。
          GITEE_REBUILD: "1"
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步"
            exit 0
          fi
          bash .github/scripts/gitee_upload.sh "yinlichaoxi007/ai-env-clone" "$TAG" "$PRERELEASE" assets
