name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "beta*"
      - "rc*"
      - "alpha*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（需已存在于仓库，如 v1.2.3）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AiEnvClone-windows
            base_name: AiEnvClone-windows
            upload_path: dist/AiEnvClone-windows.exe
            zip_app: false
          - os: macos-latest        # Apple Silicon (arm64)
            artifact: AiEnvClone-macos-arm64
            base_name: AiEnvClone-macos-arm64
            upload_path: dist/AiEnvClone-macos-arm64.app
            zip_app: true
          - os: macos-15-intel      # Intel (x86_64)，macos-13 已于 2025-12-04 退役
            artifact: AiEnvClone-macos-x86_64
            base_name: AiEnvClone-macos-x86_64
            upload_path: dist/AiEnvClone-macos-x86_64.app
            zip_app: true
          - os: ubuntu-latest
            artifact: AiEnvClone-linux
            base_name: AiEnvClone-linux
            upload_path: dist/AiEnvClone-linux
            zip_app: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # setup-python 使用 python-build-standalone 构建，自带 tkinter/Tcl-Tk，
      # 所有平台统一用它，避免 runner 自带系统 python3 缺 tkinter。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Ensure tkinter
        run: python -c "import tkinter; print('tkinter ok')"

      - name: Install build deps
        run: pip install -r requirements.txt

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
        run: python build_exe.py --name ${{ matrix.base_name }}

      # macOS 产出的是 dist/ 下的 .app 目录，压缩后上传更便于分发。
      - name: Zip macOS app
        if: ${{ matrix.zip_app }}
        shell: bash
        run: |
          cd dist
          zip -r "../${{ matrix.artifact }}.zip" "${{ matrix.base_name }}.app"

      - name: Upload artifact (zip)
        if: ${{ matrix.zip_app }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (binary)
        if: ${{ !matrix.zip_app }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 生成 release notes 需要完整 git 历史来比较 tag 范围
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 项目直接 push 无 PR 流程，GitHub 自动 notes 的 "What's Changed"
      # 为空只剩 Full Changelog 链接；改为用 git log 列出实际 commit。
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log --oneline --no-decorate "$PREV_TAG".."$TAG" > notes.md
          else
            git log --oneline --no-decorate "$TAG" > notes.md
          fi
          echo "===== notes.md ====="; cat notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Decide prerelease
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 含 rc/beta/alpha/preview/dev 等标识即预发布；
          # 纯 v1.2.3 这类稳定版本才标记正式版。
          case "$TAG" in
            *[Rr][Cc]*|*[Bb][Ee][Tt][Aa]*|*[Aa][Ll][Pp][Hh][Aa]*|*[Pp][Rr][Ee][Vv][Ii][Ee][Ww]*|*[Dd][Ee][Vv]*)
              echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: List assets
        run: ls -la assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: assets/*
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}

      # 镜像 Release 到 Gitee（需仓库配置 GITEE_TOKEN secret）。
      # 需要 Gitee 上已存在同 tag（mirror-to-gitee.yml 已同步 git 与 tag）。
      # 注意：secrets 不允许用在 if 条件中（workflow 解析会失败），
      # 因此通过 env 传入，脚本内检查空值跳过。
      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || '' }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步"
            exit 0
          fi
          REPO="yinlichaoxi007/ai-env-clone"
          echo "== check existing Gitee release: $TAG =="
          RESP=$(curl -sS -G "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG" \
                 --data-urlencode "access_token=$GITEE_TOKEN" || true)
          echo "query response: $RESP"
          RID=$(printf '%s' "$RESP" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RID" ]; then
            echo "already exists, release id=$RID"
          else
            echo "== create Gitee release =="
            RESP=$(curl -sS -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
                  --data-urlencode "access_token=$GITEE_TOKEN" \
                  --data-urlencode "tag_name=$TAG" \
                  --data-urlencode "name=$TAG" \
                  --data-urlencode "target_commitish=main" \
                  --data-urlencode "body@notes.md" \
                  --data-urlencode "prerelease=$PRERELEASE" || true)
            echo "create response: $RESP"
            RID=$(printf '%s' "$RESP" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
            echo "created, release id=$RID"
          fi
          if [ -z "$RID" ]; then
            echo "!! failed to get Gitee release id"
            exit 1
          fi
          echo "== upload assets =="
          for f in assets/*; do
            echo "uploading $(basename "$f")"
            # 注意：curl 不允许 -F(multipart) 与 --data-urlencode 混用（exit 2），
            # 因此 access_token 放 URL query string，文件用 -F 上传。
            curl -sS -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$RID/attach_files?access_token=$GITEE_TOKEN" \
                 -F "file=@$f" -w "\nHTTP %{http_code}\n"
          done
